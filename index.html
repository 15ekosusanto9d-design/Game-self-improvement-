<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Life RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1929;--bg-p:#0F2239;--bg-p2:#132B45;--bg-d:#06111E;
  --cyan:#0EA5E9;--cyan-l:#38BDF8;--cyan-g:#67E8F9;
  --teal:#2DD4BF;--teal-l:#5EEAD4;
  --amber:#FCD34D;--amber-d:#F59E0B;
  --green:#4ADE80;--purple:#A78BFA;--purple-l:#C4B5FD;
  --orange:#FB923C;--orange-l:#FDBA74;
  --pink:#F472B6;--pink-l:#F9A8D4;
  --danger:#F87171;--text:#C8E6F5;--muted:#6A9BBF;
  --border:#1E4068;--border-l:#2A5585;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:radial-gradient(ellipse at top,#0D2137 0%,#0B1929 50%,#07111E 100%);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding:14px 10px 90px;}
.display{font-family:'Cinzel',Georgia,serif;}
.container{max-width:600px;margin:0 auto;width:100%;}
.header{text-align:center;margin-bottom:14px;}
.header h1{font-size:22px;font-weight:700;color:var(--cyan-l);text-shadow:0 0 20px rgba(56,189,248,0.35);}
.header p{color:var(--muted);font-size:12px;margin-top:3px;}
.panel{background:var(--bg-p);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
.section-title{font-family:'Cinzel',serif;font-size:13px;color:var(--cyan-l);margin-bottom:12px;display:flex;align-items:center;gap:7px;font-weight:600;}
.loading-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;}
.spinner{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--cyan);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-screen p{color:var(--muted);font-size:14px;}
/* CHAR CARD */
.char-card{background:linear-gradient(145deg,var(--bg-p) 0%,#0C1E33 100%);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:12px;position:relative;overflow:hidden;}
.char-card::before{content:'';position:absolute;top:-40%;left:-10%;width:180px;height:180px;background:radial-gradient(circle,rgba(14,165,233,0.12) 0%,transparent 70%);pointer-events:none;}
.char-top{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.avatar-circle{width:68px;height:68px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#132B45,#06111E);border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 0 20px rgba(14,165,233,0.3),inset 0 0 10px rgba(0,0,0,0.5);flex-shrink:0;transition:transform 0.3s;}
.avatar-circle.bump{animation:bump 0.5s ease;}
@keyframes bump{0%{transform:scale(1);}40%{transform:scale(1.18);}100%{transform:scale(1);}}
.char-info{flex:1;min-width:0;}
.char-name-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.char-name{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--text);}
.char-title{font-size:11px;color:var(--cyan-l);font-style:italic;}
.char-level-row{display:flex;align-items:center;gap:7px;margin-top:5px;}
.level-badge{background:linear-gradient(135deg,var(--cyan),var(--cyan-l));color:#06111E;font-family:'Cinzel',serif;font-weight:700;font-size:11px;padding:2px 9px;border-radius:20px;}
.coin-badge{font-size:12px;color:var(--amber);font-weight:600;}
.gem-badge{font-size:12px;color:#C4B5FD;font-weight:600;}
.xp-bar-wrap{margin-top:8px;}
.xp-track{width:100%;height:9px;background:var(--bg-d);border-radius:6px;overflow:hidden;border:1px solid var(--border);}
.xp-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--cyan),var(--cyan-l),var(--cyan-g));transition:width 0.6s cubic-bezier(.22,1,.36,1);box-shadow:0 0 8px rgba(56,189,248,0.6);}
.xp-label{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:3px;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.stat-item{border:1px solid;border-radius:9px;padding:8px 10px;}
.stat-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:5px;}
.stat-bar-track{width:100%;height:5px;background:var(--bg-d);border-radius:4px;overflow:hidden;}
.stat-bar-fill{height:100%;border-radius:4px;transition:width 0.6s cubic-bezier(.22,1,.36,1);}
.streak-row{display:flex;align-items:center;gap:7px;margin-top:12px;font-size:12px;color:var(--muted);}
/* TAB */
.tab-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.tab-btn{background:var(--bg-p);border:1px solid var(--border);color:var(--muted);padding:9px 4px;border-radius:10px;cursor:pointer;font-size:11px;text-align:center;font-family:'Inter',sans-serif;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:3px;-webkit-tap-highlight-color:transparent;}
.tab-btn.active{background:var(--cyan);border-color:var(--cyan);color:#06111E;font-weight:600;}
.tab-icon{font-size:18px;}
/* QUEST */
.quest-list{display:flex;flex-direction:column;gap:9px;}
.quest-card{display:flex;align-items:flex-start;gap:10px;background:rgba(0,0,0,0.18);border:1px solid var(--border);border-radius:10px;padding:11px 12px;transition:all 0.2s;}
.quest-card.done{opacity:0.5;background:rgba(45,212,191,0.05);border-color:rgba(45,212,191,0.2);}
.quest-check{width:28px;height:28px;border-radius:50%;border:2px solid var(--border-l);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;font-size:14px;background:transparent;transition:all 0.2s;-webkit-tap-highlight-color:transparent;}
.quest-check.checked{background:var(--teal);border-color:var(--teal);color:#06111E;font-weight:700;}
.quest-body{flex:1;min-width:0;}
.quest-title{font-size:13px;color:var(--text);}
.quest-title.done{text-decoration:line-through;color:var(--muted);}
.quest-meta{display:flex;gap:7px;margin-top:3px;font-size:10px;color:var(--muted);flex-wrap:wrap;align-items:center;}
.quest-tag{padding:1px 6px;border-radius:10px;border:1px solid var(--border);}
.quest-reward{font-size:11px;color:var(--amber);}
.quest-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;padding:4px 5px;flex-shrink:0;opacity:0.5;line-height:1;}
.quest-edit-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px 5px;flex-shrink:0;opacity:0.5;line-height:1;-webkit-tap-highlight-color:transparent;}
.quest-edit-btn:hover{opacity:1;}
.priority-badge{font-size:9px;padding:1px 6px;border-radius:5px;font-weight:700;border:1px solid;flex-shrink:0;}
.quest-time-hd{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 6px;padding-left:2px;}
.progress-note-line{font-size:11px;color:var(--cyan-l);margin-top:4px;opacity:0.85;}
.progress-note-history{max-height:220px;overflow-y:auto;margin-top:10px;display:flex;flex-direction:column;gap:5px;}
.progress-note-hist-item{font-size:12px;color:var(--muted);background:rgba(0,0,0,0.18);padding:6px 9px;border-radius:7px;}
.quest-del:hover{opacity:1;color:var(--danger);}
.add-btn{width:100%;margin-top:10px;background:transparent;border:1.5px dashed var(--border);color:var(--muted);padding:11px;border-radius:10px;cursor:pointer;font-size:13px;transition:all 0.2s;font-family:'Inter',sans-serif;}
.add-btn:hover{border-color:var(--cyan-l);color:var(--cyan-l);}
.q-section-hd{font-size:13px;color:var(--cyan-l);font-weight:600;margin-bottom:8px;}
/* BOSS */
.boss-nodes{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-top:6px;}
.boss-node{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;background:var(--bg-d);border:2px solid var(--border);color:var(--muted);}
.boss-node.filled{background:var(--cyan);border-color:var(--cyan);color:#06111E;}
.boss-node.cur{border-color:var(--cyan);box-shadow:0 0 8px rgba(14,165,233,0.5);}
.boss-line{width:12px;height:2px;background:var(--border);flex-shrink:0;}
.boss-line.filled{background:var(--cyan);}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding-top:60px;overflow-y:auto;}
.modal-box{background:var(--bg-p2);border:1px solid var(--border);border-radius:16px;padding:20px 16px 28px;width:calc(100% - 32px);max-width:560px;margin-bottom:20px;}
.modal-box h3{color:var(--cyan-l);margin-bottom:14px;font-size:15px;font-family:'Cinzel',serif;}
.form-group{margin-bottom:11px;}
.form-group label{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
.form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg-d);border:1px solid var(--border);color:var(--text);padding:10px 11px;border-radius:8px;font-size:15px;font-family:'Inter',sans-serif;outline:none;}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--cyan);}
.form-group select option{background:var(--bg-p);}
.day-pick{display:flex;gap:5px;flex-wrap:wrap;}
.day-btn{flex:1;min-width:38px;background:var(--bg-d);border:1px solid var(--border);color:var(--muted);padding:8px 4px;border-radius:8px;cursor:pointer;font-size:11px;font-family:'Inter',sans-serif;-webkit-tap-highlight-color:transparent;}
.day-btn.active{background:var(--cyan);border-color:var(--cyan);color:#06111E;font-weight:600;}
.sub-check-wrap{display:flex;gap:4px;flex-wrap:wrap;align-items:center;max-width:120px;}
.sub-check-wrap-full{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:6px 0;}
.sub-progress-badge{background:rgba(14,165,233,0.1);border-color:var(--cyan-l);color:var(--cyan-l);}
.sub-dot{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);flex-shrink:0;transition:transform 0.12s,background 0.12s,border-color 0.12s;-webkit-tap-highlight-color:transparent;}
.sub-dot.filled{background:var(--cyan);border-color:var(--cyan);color:#06111E;font-weight:700;transform:scale(1.05);}
.btn-undo{background:rgba(14,165,233,0.14);border:1px solid var(--cyan);color:var(--cyan-l);font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer;margin-top:6px;-webkit-tap-highlight-color:transparent;}
.btn-undo:hover{background:rgba(14,165,233,0.25);color:#fff;}
.boss-row-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.boss-row-actions .add-btn{flex:1;min-width:160px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.btn{flex:1;padding:12px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;border:none;font-family:'Inter',sans-serif;}
.btn-primary{background:var(--cyan);color:#06111E;}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-danger{background:var(--danger);color:#fff;}
/* TOAST */
.toast-wrap{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:calc(100% - 20px);max-width:400px;pointer-events:none;}
.toast{background:linear-gradient(135deg,#0F2A3F,#0B1D2E);border:1px solid var(--cyan);border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,0.5);animation:toastIn 0.35s ease;font-size:13px;}
.toast.lv{background:linear-gradient(135deg,#132B45,#0A1E30);border-color:var(--amber);}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
.toast-icon{font-size:20px;flex-shrink:0;}
.toast-main{color:var(--text);}
.toast-sub{color:var(--cyan-l);font-size:10px;margin-top:2px;}
/* EVENT */
.event-banner{border-radius:12px;padding:12px 14px;margin-bottom:10px;border:1px solid;}
.event-banner.scheduled{background:linear-gradient(135deg,#0B2133,#091C2E);border-color:var(--cyan);}
.event-banner.seasonal{background:linear-gradient(135deg,#1a1230,#120D24);border-color:var(--purple);}
.event-banner.achievement{background:linear-gradient(135deg,#1E2A0A,#121800);border-color:var(--amber);}
.event-banner.random{background:linear-gradient(135deg,#2A0F1E,#1C0A15);border-color:#F472B6;}
.ev-top{display:flex;align-items:center;gap:10px;margin-bottom:5px;}
.ev-name{font-size:14px;font-weight:700;color:var(--text);flex:1;}
.ev-timer{font-size:10px;color:var(--muted);}
.ev-desc{font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:7px;}
.ev-tags{display:flex;flex-wrap:wrap;gap:5px;}
.ev-tag{font-size:10px;padding:2px 8px;border-radius:10px;}
.ev-tag.scheduled{background:rgba(14,165,233,0.15);border:1px solid rgba(14,165,233,0.3);color:var(--cyan-l);}
.ev-tag.seasonal{background:rgba(167,139,250,0.15);border:1px solid rgba(167,139,250,0.3);color:var(--purple-l);}
.ev-tag.achievement{background:rgba(252,211,77,0.15);border:1px solid rgba(252,211,77,0.3);color:var(--amber);}
.ev-tag.random{background:rgba(244,114,182,0.15);border:1px solid rgba(244,114,182,0.3);color:#F472B6;}
.ev-cal-item{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.18);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:7px;}
.ev-cal-info{flex:1;min-width:0;}
.ev-cal-name{font-size:13px;color:var(--text);font-weight:600;}
.ev-cal-when{font-size:10px;color:var(--muted);margin-top:2px;}
.ev-cal-badge{font-size:9px;padding:2px 7px;border-radius:10px;background:rgba(14,165,233,0.12);border:1px solid rgba(14,165,233,0.25);color:var(--cyan-l);flex-shrink:0;}
.ev-cal-badge.on{background:rgba(74,222,128,0.15);border-color:rgba(74,222,128,0.3);color:var(--green);}
.no-ev{text-align:center;padding:20px;color:var(--muted);font-size:13px;}
/* STATS */
.range-row{display:flex;gap:5px;margin-bottom:11px;}
.range-btn{padding:6px 12px;border-radius:8px;background:var(--bg-d);border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:12px;font-family:'Inter',sans-serif;}
.range-btn.active{background:var(--cyan);border-color:var(--cyan);color:#06111E;font-weight:600;}
.chart-legend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px;}
.legend-item{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;padding:3px 7px;border-radius:12px;border:1px solid transparent;-webkit-tap-highlight-color:transparent;}
.legend-item.off{opacity:0.35;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.chart-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
.heatmap-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
.heatmap-grid{display:flex;gap:3px;}
.heatmap-col{display:flex;flex-direction:column;gap:3px;}
.heatmap-cell{width:11px;height:11px;border-radius:2px;background:var(--bg-d);border:1px solid var(--border);}
.heatmap-legend{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--muted);margin-top:6px;justify-content:flex-end;}
.psum{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:12px;color:var(--muted);}
.psum strong{color:var(--cyan-l);}
.empty{text-align:center;padding:28px 10px;color:var(--muted);font-size:13px;}
/* BADGE */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.badge-item{background:rgba(0,0,0,0.18);border:1px solid var(--border);border-radius:10px;padding:11px 7px;text-align:center;}
.badge-item.unlocked{border-color:var(--cyan);background:rgba(14,165,233,0.06);}
.badge-item.locked{opacity:0.35;filter:grayscale(0.5);}
.badge-emoji{font-size:24px;margin-bottom:5px;}
.badge-name{font-size:11px;color:var(--text);font-weight:600;}
.badge-desc{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.4;}
/* RIVAL */
.rival-row{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer;background:rgba(0,0,0,0.15);-webkit-tap-highlight-color:transparent;}
.rival-row.me{background:rgba(14,165,233,0.08);border-color:rgba(14,165,233,0.4);cursor:default;}
.rival-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.rival-rank{font-size:13px;font-weight:700;width:22px;text-align:center;flex-shrink:0;}
.rival-info{flex:1;min-width:0;}
.rival-name{font-size:13px;color:var(--text);font-weight:600;}
.rival-stats-txt{font-size:10px;color:var(--muted);margin-top:2px;}
.rival-diff{text-align:right;flex-shrink:0;}
.rival-diff-val{font-size:11px;font-weight:700;}
.rival-diff-lbl{font-size:9px;color:var(--muted);margin-top:1px;}
.back-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;margin-bottom:14px;padding:0;}
/* JOURNEY */
.journey-start{text-align:center;padding:14px;margin-bottom:16px;background:rgba(14,165,233,0.06);border:1px solid rgba(14,165,233,0.2);border-radius:12px;}
.js-date{font-size:10px;color:var(--muted);}
.js-title{font-size:14px;color:var(--cyan-l);font-weight:600;margin-top:2px;}
.js-days{font-size:11px;color:var(--muted);margin-top:4px;}
.timeline{position:relative;padding-left:28px;}
.timeline::before{content:'';position:absolute;left:10px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,var(--cyan),transparent);}
.tl-item{position:relative;margin-bottom:14px;}
.tl-dot{position:absolute;left:-23px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--bg-p);border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;font-size:8px;}
.tl-dot.big{width:20px;height:20px;left:-25px;background:var(--cyan);}
.tl-dot.manual{border-color:var(--amber);background:rgba(252,211,77,0.15);}
.tl-content.manual{border-left:3px solid var(--amber);background:rgba(252,211,77,0.06);}
.tl-content{background:rgba(0,0,0,0.18);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.tl-content.hl{border-color:var(--cyan);background:rgba(14,165,233,0.06);}
.tl-date{font-size:10px;color:var(--muted);margin-bottom:3px;}
.tl-title{font-size:13px;color:var(--text);font-weight:600;}
.tl-sub{font-size:11px;color:var(--muted);margin-top:2px;}
/* JOURNAL */
.versus-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:14px;}
.versus-col{text-align:center;}
.vlabel{font-size:10px;color:var(--muted);margin-bottom:4px;}
.vvalue{font-family:'Cinzel',serif;font-size:22px;color:var(--cyan-l);}
.versus-vs{font-size:12px;color:var(--muted);font-style:italic;}
.versus-delta{text-align:center;font-size:12px;margin-bottom:14px;}
.versus-delta.up{color:var(--green);}
.versus-delta.down{color:var(--danger);}
.refl-card{background:rgba(0,0,0,0.18);border:1px solid var(--border);border-radius:10px;padding:12px 13px;margin-bottom:10px;}
.refl-date{font-size:10px;color:var(--muted);margin-bottom:5px;}
.refl-text{font-size:13px;color:var(--text);line-height:1.6;}
.refl-input{width:100%;background:var(--bg-d);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;margin-top:9px;resize:vertical;min-height:70px;outline:none;}
.refl-input:focus{border-color:var(--cyan);}
.refl-save{margin-top:7px;background:var(--teal);color:#06111E;border:none;padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;}
/* REWARD */
.reward-card{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.18);border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:8px;}
.reward-card.claimed{opacity:0.45;}

<script>
// ===== STEP 2: CONSTANTS & DATA =====
const STATS={
  body:      {label:'Body',      emoji:'💪',color:'#FB923C',colorL:'#FDBA74',colorA:'rgba(251,146,60,0.15)'},
  mind:      {label:'Mind',      emoji:'🧠',color:'#38BDF8',colorL:'#67E8F9',colorA:'rgba(56,189,248,0.15)'},
  career:    {label:'Career',    emoji:'💼',color:'#A78BFA',colorL:'#C4B5FD',colorA:'rgba(167,139,250,0.15)'},
  social:    {label:'Social',    emoji:'❤️', color:'#F472B6',colorL:'#F9A8D4',colorA:'rgba(244,114,182,0.15)'},
  discipline:{label:'Discipline',emoji:'✨',color:'#FCD34D',colorL:'#FDE68A',colorA:'rgba(252,211,77,0.15)'},
};
const STAT_KEYS=Object.keys(STATS);
function xpToLevel(xp){
  xp=Number(xp);
  if(!isFinite(xp)||xp<0)xp=0; // cegah NaN/undefined/Infinity bikin loop di bawah tidak pernah berhenti (penyebab freeze)
  let l=1,c=0;
  while(true){
    const n=l*100;
    if(c+n>xp)break;
    c+=n;l++;
    if(l>100000)break; // pengaman tambahan, jaga-jaga kalau ada kasus tak terduga lain
  }
  return{level:l,cur:xp-c,need:l*100,pct:(xp-c)/(l*100)};
}
function totalXP(s){return STAT_KEYS.reduce((a,k)=>a+(Number(s&&s[k])||0),0);}
// Reputasi: dihitung LANGSUNG dari perbandingan XP ke rival (bukan disimpan), supaya selalu akurat
// mengikuti posisi leaderboard terkini, tanpa perlu migrasi data atau ikut campur ke sistem undo.
function getReputation(playerXP,rivals){
  if(!rivals||!rivals.length)return{beaten:0,total:0,tier:'Pemula'};
  const beaten=rivals.filter(r=>playerXP>r.totalXP).length;
  const total=rivals.length;
  const tier=beaten>=total?'Juara':beaten>=total*0.7?'Unggul':beaten>=total*0.4?'Menantang':'Pemula';
  return{beaten,total,tier};
}
function overallLv(s){return xpToLevel(totalXP(s));}
function avatarStage(l){if(l>=50)return{name:'Pohon Besar',emoji:'🌳'};if(l>=25)return{name:'Pohon Muda',emoji:'🌲'};if(l>=10)return{name:'Tunas',emoji:'🌱'};return{name:'Benih',emoji:'🌰'};}
const LV_TITLES=[{m:50,t:'Pohon Besar Sejati'},{m:40,t:'Maestro Kehidupan'},{m:30,t:'Legenda Hidup'},{m:25,t:'Penjaga Cahaya'},{m:20,t:'Ksatria Tekad'},{m:15,t:'Prajurit Disiplin'},{m:10,t:'Penjelajah Sejati'},{m:5,t:'Petualang Berbakat'},{m:1,t:'Benih'}];
function getLvTitle(l){for(const x of LV_TITLES)if(l>=x.m)return x.t;return 'Benih';}
const LV_REWARDS={2:{coin:50,fz:0},5:{coin:150,fz:1,gem:1},7:{coin:200,fz:0},10:{coin:300,fz:1,gem:2},15:{coin:400,fz:1,gem:2},20:{coin:500,fz:2,gem:3},25:{coin:750,fz:2,gem:5},30:{coin:1000,fz:2,gem:5},40:{coin:1500,fz:3,gem:8},50:{coin:2000,fz:3,gem:10}};
function getLvReward(l){return LV_REWARDS[l]||(l%5===0?{coin:l*20,fz:0}:null);}
const PRAISE=['Mantap, satu langkah lagi! 🔥','Konsisten itu kuncinya! ⚡','Karaktermu makin kuat! 💫','Kerja bagus! 🚀','Itu baru namanya progres! ✨','Disiplin kecil, hasil besar. 👏','Kamu baru saja menang hari ini. 🏅','Satu quest lagi ke tujuan. 🎯'];
const PRAISE_LV=['LEVEL UP! Karaktermu naik level! 🎉','Evolusi! Kamu makin kuat! ⚡✨','Level baru terbuka! 🏆'];
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36);}
function todayStr(){
  // Anchor eksplisit ke WIB (UTC+7), bukan UTC device / timezone browser.
  // Ini dipakai di SELURUH app (reset harian, streak, tanggal xp log, stats) supaya konsisten:
  // pergantian hari selalu jam 24.00 WIB, bukan jam 07.00 pagi WIB (bug lama akibat toISOString() = UTC).
  const wib=new Date(Date.now()+7*3600000);
  return wib.toISOString().slice(0,10);
}
function weekKeyWIB(dateStr){
  // Kunci minggu = tanggal hari Senin dari minggu yang mengandung dateStr (WIB).
  // Reset weekly terjadi saat kunci ini berubah, yaitu tepat Minggu 24.00 WIB / Senin 00.00 WIB.
  const d=new Date(dateStr+'T00:00:00Z');
  const dow=d.getUTCDay(); // 0=Min,1=Sen,...6=Sab
  const diffToMonday=(dow+6)%7;
  d.setUTCDate(d.getUTCDate()-diffToMonday);
  return d.toISOString().slice(0,10);
}
const DOW_LABELS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function questActiveToday(q){
  if(q.type!=='daily')return true;
  if(!q.days||!q.days.length)return true; // tanpa hari spesifik = setiap hari (default lama)
  return q.days.includes(new Date().getDay());
}

// ===== TROFI =====
// Disusun campuran: tingkatan progresif (level per-stat, level keseluruhan, streak, dll)
// + trofi unik/lucu (waktu selesai quest, variasi hari, rival, dll) — total 55+ trofi.
const BADGE_CATS=['Level Keseluruhan','Level Per-Stat','Beruntun (Streak)','Total Quest','Boss Quest','Kekayaan','Keseimbangan','Unik & Spesial'];
const BADGES=[];
// 1) Level keseluruhan
[3,5,10,15,20,25,30,40,50,75,100].forEach(lv=>{
  BADGES.push({id:'lv_'+lv,cat:'Level Keseluruhan',name:'Level '+lv,emoji:lv>=100?'🌟':lv>=50?'🌳':lv>=25?'🌲':lv>=10?'🌱':'🥉',
    desc:'Capai Level '+lv+' overall',chk:c=>overallLv(c.stats).level>=lv});
});
// 2) Level per-stat (5 stat x 6 tingkatan)
const STAT_TIER_EMOJI={3:'🔹',5:'⭐',10:'🏅',15:'💎',25:'👑',50:'🏆'};
STAT_KEYS.forEach(k=>{
  [3,5,10,15,25,50].forEach(lv=>{
    BADGES.push({id:'stat_'+k+'_'+lv,cat:'Level Per-Stat',name:STATS[k].label+' Lv'+lv,emoji:STAT_TIER_EMOJI[lv],
      desc:'Level '+lv+' '+STATS[k].label,chk:c=>xpToLevel(c.stats[k]).level>=lv});
  });
});
// 3) Streak
[3,7,14,21,30,60,100,180,365].forEach(d=>{
  BADGES.push({id:'streak_'+d,cat:'Beruntun (Streak)',name:'Beruntun '+d+' Hari',emoji:d>=100?'🌋':d>=30?'🔥🔥':'🔥',
    desc:'Streak '+d+' hari',chk:c=>c.streak>=d});
});
// 4) Total quest selesai
[1,10,25,50,100,250,500,1000].forEach(n=>{
  BADGES.push({id:n===1?'first_quest':'q'+n,cat:'Total Quest',name:n===1?'Langkah Pertama':n+' Quest Selesai',emoji:n===1?'🥾':n>=500?'🏛️':n>=100?'🏅':'🛠️',
    desc:n===1?'Selesaikan quest pertamamu':n+' quest selesai total',chk:c=>c.questsDone>=n});
});
// 5) Boss quest
[1,3,5,10].forEach(n=>{
  BADGES.push({id:'boss'+n,cat:'Boss Quest',name:n===1?'Penakluk Pertama':'Penakluk x'+n,emoji:'👑',
    desc:n+' Boss Quest selesai',chk:c=>c.bossesCompleted>=n});
});
// 6) Koin (lifetime didapat, bukan saldo — jadi tidak hilang kalau dibelanjakan)
[500,1000,5000,10000,50000].forEach(n=>{
  BADGES.push({id:'earn'+n,cat:'Kekayaan',name:'Penghasilan '+n.toLocaleString('id')+' Koin',emoji:n>=10000?'💰':'🪙',
    desc:'Kumpulkan total '+n.toLocaleString('id')+' koin sepanjang waktu',chk:c=>(c.totalCoinsEarned||0)>=n});
});
// 7) Keseimbangan semua stat
[5,10,25].forEach(lv=>{
  BADGES.push({id:'balanced'+lv,cat:'Keseimbangan',name:'Seimbang Lv'+lv,emoji:'☯️',desc:'Semua stat min Lv'+lv,
    chk:c=>STAT_KEYS.every(k=>xpToLevel(c.stats[k]).level>=lv)});
});
// 8) Unik & lucu
BADGES.push(
  {id:'early_bird',cat:'Unik & Spesial',name:'Si Rajin Pagi',emoji:'🌅',desc:'Selesaikan quest sebelum jam 6 pagi WIB',chk:c=>(c.earlyBirdCount||0)>=1},
  {id:'early_bird_5',cat:'Unik & Spesial',name:'Ayam Jantan',emoji:'🐓',desc:'5x selesaikan quest sebelum jam 6 pagi WIB',chk:c=>(c.earlyBirdCount||0)>=5},
  {id:'night_owl',cat:'Unik & Spesial',name:'Burung Hantu',emoji:'🦉',desc:'Selesaikan quest setelah jam 11 malam WIB',chk:c=>(c.nightOwlCount||0)>=1},
  {id:'night_owl_5',cat:'Unik & Spesial',name:'Penjaga Malam',emoji:'🌃',desc:'5x selesaikan quest setelah jam 11 malam WIB',chk:c=>(c.nightOwlCount||0)>=5},
  {id:'weekend_warrior',cat:'Unik & Spesial',name:'Pejuang Akhir Pekan',emoji:'🎉',desc:'10x selesaikan quest di akhir pekan',chk:c=>(c.weekendQuestCount||0)>=10},
  {id:'renaissance1',cat:'Unik & Spesial',name:'Manusia Seutuhnya',emoji:'🌈',desc:'Latih semua stat dalam 1 hari',chk:c=>(c.renaissanceCount||0)>=1},
  {id:'renaissance10',cat:'Unik & Spesial',name:'Manusia Serba Bisa',emoji:'🌈✨',desc:'10x latih semua stat dalam 1 hari',chk:c=>(c.renaissanceCount||0)>=10},
  {id:'sub_master',cat:'Unik & Spesial',name:'Master Sub-Tugas',emoji:'✅',desc:'50x centang sub-tugas (misal ibadah, dll)',chk:c=>(c.subTicksTotal||0)>=50},
  {id:'weekly_first',cat:'Unik & Spesial',name:'Perencana Mingguan',emoji:'🗓️',desc:'Selesaikan 1 quest mingguan',chk:c=>(c.weeklyQuestsDone||0)>=1},
  {id:'weekly_vet',cat:'Unik & Spesial',name:'Veteran Mingguan',emoji:'📆',desc:'Selesaikan 20 quest mingguan',chk:c=>(c.weeklyQuestsDone||0)>=20},
  {id:'week_variety',cat:'Unik & Spesial',name:'Konsisten 7 Hari',emoji:'🗺️',desc:'Pernah selesaikan quest di ketujuh hari (Min-Sab)',chk:c=>Array.isArray(c.dowCompleted)&&c.dowCompleted.every(Boolean)},
  {id:'busy_day5',cat:'Unik & Spesial',name:'Hari Produktif',emoji:'⚡',desc:'Selesaikan 5 quest dalam 1 hari',chk:c=>(c.maxQuestsInDay||0)>=5},
  {id:'busy_day8',cat:'Unik & Spesial',name:'Hari Luar Biasa',emoji:'⚡⚡',desc:'Selesaikan 8 quest dalam 1 hari',chk:c=>(c.maxQuestsInDay||0)>=8},

const TRADING_WINDOW_MS=5*60*1000;
function tradingWindowKey(ts){return Math.floor(ts/TRADING_WINDOW_MS);}
// Update nilai semua holding — instrumen harian (deposito/saham/kripto) sekali per hari,
// instrumen trading tiap jendela 5 menit — semua berdasarkan waktu ASLI (bukan setInterval yang
// bisa berhenti kalau tab di-background), jadi hasilnya selalu benar walau app baru dibuka lagi
// setelah lama, dan TIDAK butuh app "jalan terus" di latar belakang untuk tetap akurat.
function updateFinanceDaily(){
  const today=todayStr();
  const winKey=tradingWindowKey(Date.now());
  let changed=false,charChanged=false;
  const dividendLog=[];
  APP.finance.forEach(h=>{
    const type=FINANCE_TYPES[h.type];
    if(!type)return;
    if(type.interval==='window'){
      if(h.lastUpdateWindow===winKey)return;
      const seed=winKey*7919+hashStr(h.id);
      h.value=Math.max(0,h.value*(1+type.rate(seed)));
      h.lastUpdateWindow=winKey;
      changed=true;
    } else {
      if(h.lastUpdateDate===today)return;
      const dateSeed=parseInt(today.replace(/-/g,''),10);
      const seed=dateSeed+hashStr(h.id);
      h.value=Math.max(0,h.value*(1+type.rate(seed)));
      // Dividen: bonus koin harian terpisah dari naik-turun harga, dibayar tunai ke kas
      // (bukan ditambahkan ke nilai holding) — jadi selalu dapat sesuatu tiap hari selama pegang saham.
      if(type.dividendRate>0&&APP.char){
        const div=Math.round(h.value*type.dividendRate);
        if(div>0){
          APP.char.coins+=div;
          APP.char.totalCoinsEarned=(APP.char.totalCoinsEarned||0)+div;
          h.dividendsEarned=(h.dividendsEarned||0)+div;
          dividendLog.push({type:type.name,amount:div});
          charChanged=true;
        }
      }
      h.lastUpdateDate=today;
      changed=true;
    }
  });
  if(changed)lsSetSync('finance',APP.finance);
  if(charChanged){
    saveChar();
    const total=dividendLog.reduce((a,d)=>a+d.amount,0);
    if(total>0)setTimeout(()=>pushToast('💵','Dividen Diterima!','+'+total+' 🪙 dari '+dividendLog.length+' saham',true),1200);
  }
}
function financeNetWorth(){
  const investVal=APP.finance.reduce((a,h)=>a+h.value,0);
  const investPrincipal=APP.finance.reduce((a,h)=>a+h.principal,0);
  const investDividends=APP.finance.reduce((a,h)=>a+(h.dividendsEarned||0),0);
  const collVal=(APP.collectibles||[]).reduce((a,h)=>a+collectibleMarketPrice(h.type),0);
  const collCost=(APP.collectibles||[]).reduce((a,h)=>a+(h.totalCost||0),0);
  const totalReturn=(investVal-investPrincipal)+investDividends+(collVal-collCost);
  return{cash:APP.char?APP.char.coins:0,investVal,collVal,totalReturn,total:(APP.char?APP.char.coins:0)+investVal+collVal};
}
function investCoins(type,amount){
  amount=Math.floor(amount);
  const t=FINANCE_TYPES[type];
  if(!t||amount<t.minInvest||amount>APP.char.coins)return false;
  APP.char.coins-=amount;
  saveChar();
  let h=APP.finance.find(x=>x.type===type);
  if(h){h.principal+=amount;h.value+=amount;}
  else{h={id:uid(),type,principal:amount,value:amount,createdDate:todayStr(),lastUpdateDate:todayStr(),dividendsEarned:0};APP.finance.push(h);}
  lsSetSync('finance',APP.finance);
  return true;
}
function withdrawInvestment(id,amount){
  const h=APP.finance.find(x=>x.id===id);
  if(!h)return;
  const sellAmount=amount==null?h.value:Math.min(amount,h.value);
  if(sellAmount<=0)return;
  const frac=sellAmount/h.value;
  const principalPortion=h.principal*frac;
  APP.char.coins+=Math.round(sellAmount);
  APP.char.totalCoinsEarned=(APP.char.totalCoinsEarned||0)+Math.max(0,Math.round(sellAmount)-principalPortion);
  saveChar();
  if(sellAmount>=h.value-0.01){
    APP.finance=APP.finance.filter(x=>x.id!==id);
  } else {
    h.value=Math.round((h.value-sellAmount)*100)/100;
    h.principal=Math.round(h.principal-principalPortion);
  }
  lsSetSync('finance',APP.finance);
}

// makin lama ditunda, makin mahal. Beli sekarang, jual nanti kalau harganya sudah naik.
const COLLECTIBLE_EPOCH='2026-01-01';
const COLLECTIBLE_DEFS=[
  {id:'gold',name:'Emas Batangan',icon:'🥇',basePrice:100,growthPerDay:0.0035,growthLabel:'+0.35%/hari'},
  {id:'painting',name:'Lukisan Klasik',icon:'🖼️',basePrice:250,growthPerDay:0.005,growthLabel:'+0.5%/hari'},

  {id:'card',name:'Kartu Koleksi Langka',icon:'🃏',basePrice:75,growthPerDay:0.006,growthLabel:'+0.6%/hari'},
];
function collectibleMarketPrice(typeId){
  const def=COLLECTIBLE_DEFS.find(d=>d.id===typeId);
  if(!def)return 0;
  const days=Math.max(0,Math.floor((new Date(todayStr())-new Date(COLLECTIBLE_EPOCH))/86400000));
  return Math.round(def.basePrice*Math.pow(1+def.growthPerDay,days));
}
function buyCollectible(typeId,qty){
  qty=Math.max(1,Math.floor(qty)||1);
  const unitPrice=collectibleMarketPrice(typeId);
  const totalPrice=unitPrice*qty;
  if(unitPrice<=0||totalPrice>APP.char.coins)return false;
  APP.char.coins-=totalPrice;saveChar();
  let h=APP.collectibles.find(x=>x.type===typeId);
  if(h){h.quantity+=qty;h.totalCost+=totalPrice;}
  else{h={id:uid(),type:typeId,quantity:qty,totalCost:totalPrice};APP.collectibles.push(h);}
  lsSetSync('collectibles',APP.collectibles);
  return true;
}
function sellCollectible(id,qty){
  const h=APP.collectibles.find(x=>x.id===id);
  if(!h)return;
  const sellQty=qty==null?h.quantity:Math.min(qty,h.quantity);
  if(sellQty<=0)return;
  const unitPrice=collectibleMarketPrice(h.type);
  const total=Math.round(unitPrice*sellQty);
  const costPortion=h.totalCost*(sellQty/h.quantity);
  APP.char.coins+=total;
  APP.char.totalCoinsEarned=(APP.char.totalCoinsEarned||0)+Math.max(0,total-costPortion);
  saveChar();
  if(sellQty>=h.quantity){
    APP.collectibles=APP.collectibles.filter(x=>x.id!==id);
  } else {
    h.quantity-=sellQty;
    h.totalCost=Math.round(h.totalCost-costPortion);
  }
  lsSetSync('collectibles',APP.collectibles);
}
function getTodayRandomEvent(){
  const today=todayStr();
  const seed=parseInt(today.replace(/-/g,''),10);
  const roll=seededRand(seed);
  if(roll>=RANDOM_EVENT_CHANCE)return null;
  const idx=Math.floor(seededRand(seed+1)*RANDOM_EVENT_DEFS.length)%RANDOM_EVENT_DEFS.length;
  return {...RANDOM_EVENT_DEFS[idx],type:'random',dur:'Hari ini saja (acak)',check:()=>true};
}

function calcMult(evs,statType){
  if(!evs||!evs.length)return{xp:1,coin:1};
  let xpMax=1,cMax=1,xpEx=0,cEx=0;
  evs.forEach(ev=>{
    const sm=(ev.statB&&ev.statB[statType])?ev.statB[statType]:ev.xpM||1;
    if(sm>xpMax){xpEx+=xpMax-1;xpMax=sm;}else xpEx+=sm-1;
    const cm=ev.coinM||1;
    if(cm>cMax){cEx+=cMax-1;cMax=cm;}else cEx+=cm-1;
  });
  return{xp:Math.max(1,xpMax+xpEx*0.5),coin:Math.max(1,cMax+cEx*0.5)};
}

function initRivals(playerXP){
  playerXP=Number(playerXP)||0;
  const band=rivalBand(playerXP);
  return RIVAL_DEFS.map((d,i)=>{
    const startXP=Math.max(0,Math.round(playerXP+band*RIVAL_OFFSET_PCT[i]));
    const stats=STAT_KEYS.reduce((o,k)=>{o[k]=Math.round(startXP*(k===d.spec?0.28:0.18));return o;},{});
    return{
      ...d,stats,
      totalXP:startXP,streak:RIVAL_STREAK[i],lastUpdated:null,todayXP:0,
    };
  });
}
function updateRivals(rivals,playerXP){
  playerXP=Number(playerXP)||0;
  const band=rivalBand(playerXP);
  const today=todayStr(),dow=new Date().getDay(),dom=new Date().getDate(),isWe=dow===0||dow===6;
  return rivals.map(r=>{
    if(r.lastUpdated===today)return r;
    const seed=parseInt(r.id.replace('r',''))*1000+parseInt(today.replace(/-/g,''))%10000;
    const rng=n=>((seed*1664525+n*1013904223)&0x7fffffff)/0x7fffffff;
    if(rng(1)<r.skip)return{...r,lastUpdated:today,todayXP:0};
    let base=80+rng(2)*120;
    const m=isWe?r.weM:r.wdM;
    if(r.p==='sprinter')base*=dom<=10?1.5:dom<=20?1.0:0.5;
    if(r.p==='chaotic')base*=rng(3)>0.7?2.5:0.3;
    let txp=Math.round(base*m);
    // "Karet gelang" biar jarak level tetap kerasa lomba: rival yang kejauhan di depan otomatis
    // melambat (kayak lagi jenuh), yang ketinggalan jauh dapat lonjakan semangat buat balik dekat.
    const diffAfter=(r.totalXP+txp)-playerXP;
    if(diffAfter>band)txp=Math.max(0,Math.round(txp*0.3));
    else if(diffAfter<-band)txp=Math.round(txp*2+30);
    const ns={...r.stats};
    STAT_KEYS.forEach(k=>{ns[k]=(ns[k]||0)+Math.round(txp*(k===r.spec?0.35:0.1625));});
    return{...r,stats:ns,totalXP:r.totalXP+txp,streak:r.streak+1,lastUpdated:today,todayXP:txp};
  });
}
</script>
<script>
// ===== STEP 3: APP STATE =====
const APP={
  char:null,quests:[],badges:[],xpLog:[],rewards:[],reflections:[],
  achievEvs:[],journey:[],rivals:[],finance:[],collectibles:[],
  tab:'quests',syncStatus:'idle',
  toasts:[],toastTimer:null,
  visStats:['body','mind','career','social','discipline'],
  chartRange:30,
  showModal:null,   // 'addQuest'|'addReward'|'deleteConfirm'|'rivalDetail'|'deleteBoss'
  rivalDetail:null, // rival id
  editQuestId:null,
  autoSyncInt:null,tradingInt:null,
  lastAction:null,  // {questId, ts, charSnap, prevQuestState} — undo untuk misklik, cuma tersimpan di memori (hilang saat refresh)
  deleteBossId:null,diagnosticResults:null,investPresetType:null,buyCollectibleType:null,
  sellFinanceId:null,sellCollectibleId:null,progressNoteQuestId:null,showAllProgressNotes:false,
};

function lsLoad(){
 try{
  let char=lsGet('character');
  const noLocal=!char;
  if(!char)char=defaultChar();
  // toArr: kalau data lama/corrupt bukan array (misal sisa format versi sebelumnya),
  // jangan biarkan .map()/.filter() di bawah ini crash dan bikin seluruh app macet di loading screen.
  const toArr=v=>Array.isArray(v)?v:[];
  let quests=lsGet('quests');
  quests=quests&&Array.isArray(quests)&&quests.length?quests:defaultQuests();
  let badges=toArr(lsGet('badges'));
  let xpLog=toArr(lsGet('xp_log'));
  let rewards=toArr(lsGet('rewards'));
  let reflections=toArr(lsGet('reflections'));
  let achievEvs=toArr(lsGet('achiev_events'));
  let journey=toArr(lsGet('journey'));
  let finance=toArr(lsGet('finance')).map(h=>{
    if(h&&h.type==='saham')h={...h,type:OLD_SAHAM_ALIAS}; // migrasi: 'saham' generik lama -> Saham Energi
    if(h&&typeof h.dividendsEarned!=='number')h={...h,dividendsEarned:0};
    return h;
  }).filter(h=>h&&typeof h==='object'&&FINANCE_TYPES[h.type]);
  const finMerged={};
  finance.forEach(h=>{
    if(finMerged[h.type]){finMerged[h.type].principal+=h.principal;finMerged[h.type].value+=h.value;finMerged[h.type].dividendsEarned=(finMerged[h.type].dividendsEarned||0)+(h.dividendsEarned||0);}
    else finMerged[h.type]={...h};
  });
  finance=Object.values(finMerged);
  let collectibles=toArr(lsGet('collectibles')).filter(h=>h&&typeof h==='object'&&COLLECTIBLE_DEFS.some(d=>d.id===h.type))
    .map(h=>{
      if(typeof h.quantity!=='number'){
        // migrasi format lama (1 entri = 1 unit dengan buyPrice) ke format baru (kuantitas per jenis)
        return{id:h.id,type:h.type,quantity:1,totalCost:h.buyPrice||collectibleMarketPrice(h.type)};
      }
      return h;
    });
  // Gabungkan duplikat jenis yang sama jadi satu holding (jaga-jaga dari data lama sebelum konsolidasi)
  const collMerged={};
  collectibles.forEach(h=>{
    if(collMerged[h.type]){collMerged[h.type].quantity+=h.quantity;collMerged[h.type].totalCost+=h.totalCost;}
    else collMerged[h.type]={...h};
  });
  collectibles=Object.values(collMerged);
  let rivals=lsGet('rivals');
  const playerXP=totalXP(char.stats);
  const band=rivalBand(playerXP);
  if(!rivals||!Array.isArray(rivals)||rivals.length!==10)rivals=initRivals(playerXP);
  rivals=updateRivals(rivals,playerXP);
  // Migrate rivals - pastikan field g selalu ada
  rivals=rivals.map((r,i)=>{
    if(!r.g){const def=RIVAL_DEFS[i]||RIVAL_DEFS.find(d=>d.id===r.id)||RIVAL_DEFS[0];r.g=def?def.g:['#0EA5E9','#2DD4BF'];}
    if(!r.emoji){const def=RIVAL_DEFS.find(d=>d.id===r.id)||RIVAL_DEFS[i]||RIVAL_DEFS[0];r.emoji=def?def.emoji:'🌟';}
    // pastikan semua STAT_KEYS ada supaya tidak ada nilai undefined saat dihitung levelnya
    if(!r.stats||typeof r.stats!=='object')r.stats={};
    STAT_KEYS.forEach(k=>{if(typeof r.stats[k]!=='number'||!isFinite(r.stats[k]))r.stats[k]=0;});
    if(typeof r.totalXP!=='number'||!isFinite(r.totalXP))r.totalXP=totalXP(r.stats);
    // Rebalance sekali kalau rival ini kejauhan dari pemain (misal sisa data lama sebelum fitur ini ada),
    // biar langsung terasa dekat lagi, bukan nunggu berhari-hari dikoreksi pelan-pelan.
    const diff=r.totalXP-playerXP;
    if(Math.abs(diff)>band*2.5){
      const target=Math.max(0,playerXP+band*RIVAL_OFFSET_PCT[i]);
      const scale=r.totalXP>0?target/r.totalXP:0;
      const newStats={};STAT_KEYS.forEach(k=>newStats[k]=Math.max(0,Math.round((r.stats[k]||0)*scale)));
      r={...r,stats:newStats,totalXP:Math.round(target)};
    }
    return r;
  });
  lsSet('rivals',rivals);
  // Migrate old field names
  badges=badges.filter(b=>typeof b==='string');
  if(char.streakFreezes!=null&&char.freezes==null)char.freezes=char.streakFreezes;
  if(char.lastActiveDate!=null&&char.lastActive==null)char.lastActive=char.lastActiveDate;
  if(char.lastStreakDate==null&&char.lastActive!=null)char.lastStreakDate=char.lastActive;
  // Migrasi counter trofi baru — default aman untuk data lama yang belum punya field ini
  if(typeof char.totalCoinsEarned!=='number')char.totalCoinsEarned=char.coins||0;
  if(typeof char.earlyBirdCount!=='number')char.earlyBirdCount=0;
  if(typeof char.nightOwlCount!=='number')char.nightOwlCount=0;
  if(typeof char.weekendQuestCount!=='number')char.weekendQuestCount=0;
  if(typeof char.renaissanceCount!=='number')char.renaissanceCount=0;
  if(typeof char.subTicksTotal!=='number')char.subTicksTotal=0;
  if(typeof char.weeklyQuestsDone!=='number')char.weeklyQuestsDone=0;
  if(!Array.isArray(char.dowCompleted)||char.dowCompleted.length!==7)char.dowCompleted=[false,false,false,false,false,false,false];
  if(typeof char.comebackCount!=='number')char.comebackCount=0;
  if(!Array.isArray(char.eventsSeen))char.eventsSeen=[];
  if(typeof char.todayQuestCount!=='number')char.todayQuestCount=0;
  if(char.todayQuestDate===undefined)char.todayQuestDate=null;
  if(typeof char.maxQuestsInDay!=='number')char.maxQuestsInDay=0;
  if(char.randomFreezeClaimedDate===undefined)char.randomFreezeClaimedDate=null;
  if(char.dailyMilestoneDate===undefined)char.dailyMilestoneDate=null;
  if(!Array.isArray(char.dailyMilestonesClaimed))char.dailyMilestonesClaimed=[];
  if(typeof char.gems!=='number')char.gems=0;
  if(!Array.isArray(char.streakMilestonesSeen))char.streakMilestonesSeen=[];
  if(char.questsCompletedTotal!=null&&char.questsDone==null)char.questsDone=char.questsCompletedTotal;
  // migrate quests field names
  quests=quests.filter(q=>q&&typeof q==='object').map(q=>{
    if(q.statType&&!q.stat)q.stat=q.statType;
    if(q.completedToday!=null&&q.done==null)q.done=q.completedToday;
    if(q.bossProgress&&!q.boss)q.boss={cur:q.bossProgress.current||0,target:q.bossProgress.target||5};
    return q;
  });
  // migrate xpLog field names
  xpLog=xpLog.filter(e=>e&&typeof e==='object').map(e=>{if(e.statType&&!e.stat)e.stat=e.statType;return e;});
  Object.assign(APP,{char,quests,badges,xpLog,rewards,reflections,achievEvs,journey,rivals,finance,collectibles});
  return noLocal;
 }catch(err){
  // Kalau ada data lama yang benar-benar rusak dan tak terduga, jangan biarkan seluruh app macet.
  // Reset ke kondisi default yang aman supaya app tetap bisa dipakai.
  console.error('lsLoad gagal, reset ke default:',err);
  Object.assign(APP,{char:defaultChar(),quests:defaultQuests(),badges:[],xpLog:[],rewards:[],reflections:[],achievEvs:[],journey:[],rivals:initRivals(),finance:[],collectibles:[]});
  return true;
 }
}

function saveChar(){lsSetSync('character',APP.char);}
function saveQuests(){lsSetSync('quests',APP.quests);}
function saveBadges(){lsSetSync('badges',APP.badges);}
function saveRewards(){lsSetSync('rewards',APP.rewards);}
function saveReflections(){lsSetSync('reflections',APP.reflections);}
function saveAchievEvs(){lsSetSync('achiev_events',APP.achievEvs);}
function saveJourney(){lsSetSync('journey',APP.journey);}

// ===== JOURNEY LOG =====
function addJourneyItem(type,title,sub){
  APP.journey.push({type,title,sub:sub||'',date:todayStr(),ts:Date.now()});
  if(APP.journey.length>200)APP.journey.splice(0,APP.journey.length-200);
  saveJourney();
}
const BIG_TYPES=['avatar_evolve','boss_done','streak_milestone'];
const ICON_MAP={start:'🌰',level_up:'⭐',avatar_evolve:'🌿',badge:'🏅',boss_done:'👑',streak_milestone:'🔥',event:'🎉',manual:'📝'};

// ===== TOAST =====
let _toastId=0;
function pushToast(icon,main,sub,isLv){
  const id=++_toastId;
  APP.toasts.push({id,icon,main,sub:sub||'',isLv:!!isLv});
  render();
  setTimeout(()=>{APP.toasts=APP.toasts.filter(t=>t.id!==id);render();},3200);
}

// ===== ACHIEVEMENT EVENTS =====
function triggerAchievEv(def){
  const now=Date.now();
  if(APP.achievEvs.some(e=>e.id===def.id&&e.exp>now))return;
  const ev={...def,exp:now+def.hrs*3600000};
  delete ev.trigger;delete ev.isComeback;delete ev.isBoss;delete ev.isRen;
  APP.achievEvs=APP.achievEvs.filter(e=>e.id!==def.id);
  APP.achievEvs.push(ev);
  saveAchievEvs();
  if(def.fz>0){APP.char.freezes=(APP.char.freezes||0)+def.fz;saveChar();}
  if(!Array.isArray(APP.char.eventsSeen))APP.char.eventsSeen=[];
  if(!APP.char.eventsSeen.includes(def.id)){APP.char.eventsSeen.push(def.id);saveChar();}
  if(def.isComeback){APP.char.comebackCount=(APP.char.comebackCount||0)+1;saveChar();}
  pushToast(def.icon,'EVENT: '+def.name,def.desc,true);
  addJourneyItem('event','Event: '+def.name,def.desc);
}
function getActiveAchievEvs(){
  const now=Date.now();
  return APP.achievEvs.filter(e=>!e.exp||e.exp>now);
}
function cleanAchievEvs(){
  const now=Date.now();
  APP.achievEvs=APP.achievEvs.filter(e=>!e.exp||e.exp>now);
  saveAchievEvs();
}

// ===== UNDO QUEST (batalkan misklik) =====
// Ambil snapshot field char yang bisa berubah akibat menyelesaikan quest (termasuk efek
// samping seperti reward level-up), supaya bisa dikembalikan persis kalau di-undo.
function snapshotChar(c){
  return{stats:{...c.stats},coins:c.coins,freezes:c.freezes,streak:c.streak,
    lastActive:c.lastActive,lastStreakDate:c.lastStreakDate,
    questsDone:c.questsDone,bossesCompleted:c.bossesCompleted,
    totalCoinsEarned:c.totalCoinsEarned,earlyBirdCount:c.earlyBirdCount,nightOwlCount:c.nightOwlCount,
    weekendQuestCount:c.weekendQuestCount,renaissanceCount:c.renaissanceCount,subTicksTotal:c.subTicksTotal,
    weeklyQuestsDone:c.weeklyQuestsDone,dowCompleted:[...(c.dowCompleted||[])],comebackCount:c.comebackCount,
    eventsSeen:[...(c.eventsSeen||[])],todayQuestCount:c.todayQuestCount,todayQuestDate:c.todayQuestDate,
    maxQuestsInDay:c.maxQuestsInDay,gems:c.gems,streakMilestonesSeen:[...(c.streakMilestonesSeen||[])],
    dailyMilestoneDate:c.dailyMilestoneDate,dailyMilestonesClaimed:[...(c.dailyMilestonesClaimed||[])]};
}
// undoLastAction: hanya bisa membatalkan AKSI TERAKHIR (bukan sembarang quest lama),
// supaya tidak menghapus progres quest lain yang mungkin sudah dikerjakan setelahnya.
function undoLastAction(){
  const la=APP.lastAction;
  if(!la)return;
  const q=APP.quests.find(x=>x.id===la.questId);
  if(!q)return;
  Object.assign(APP.char,la.charSnap);
  if(la.kind==='boss'){q.boss.cur=la.prevBossCur;}
  else if(la.kind==='sub'){q.subDone=la.prevSubDone;q.done=false;}
  else{q.done=false;}
  // buang entri xp log yang barusan ditambahkan biar statistik tidak dobel-hitung
  APP.xpLog=(APP.xpLog||[]).filter(e=>e.ts!==la.ts);
  lsSet('xp_log',APP.xpLog);
  saveChar();saveQuests();
  APP.lastAction=null;
  pushToast('↺','Dibatalkan','Progres quest dikembalikan seperti semula');
}

// ===== COMPLETE QUEST =====
// applyQuestReward: inti pemberian reward, dipakai baik oleh quest biasa (completeQuest)
// maupun quest bertahap/sub-tugas (tickSubQuest). isFinal menandai apakah ini penyelesaian
// penuh (quest biasa selesai / sub-tugas terakhir) — hanya saat itu questsDone, streak-milestone,
// dan pengecekan trofi/achievement dijalankan, supaya trofi tidak "kebobolan" di tengah progres.
function applyQuestReward(q,xpAmount,coinAmount,isFinal,isBossDone,ts){
  ts=ts||Date.now();
  const today=todayStr();
  const c=APP.char;

  const prevStatXP=c.stats[q.stat]||0,prevStatLv=xpToLevel(prevStatXP).level;
  const prevTXP=totalXP(c.stats),prevOvLv=xpToLevel(prevTXP).level;
  const prevAvStage=avatarStage(prevOvLv).emoji;

  const allActive=[...getActiveScheduled(),...getActiveAchievEvs()];
  const mult=calcMult(allActive,q.stat);
  const bonusXP=Math.round(xpAmount*mult.xp);
  const loot=Math.random()<0.15?Math.ceil(coinAmount*1.5)+5:0;
  const finalCoin=Math.round((coinAmount+loot)*mult.coin);

  const newStatXP=prevStatXP+bonusXP;
  const newStatLv=xpToLevel(newStatXP).level;
  const newTXP=prevTXP+bonusXP;
  const newOvLv=xpToLevel(newTXP).level;
  const newAvStage=avatarStage(newOvLv);

  let newStreak=c.streak||0;
  if(c.lastStreakDate!==today){newStreak=(c.streak||0)+1;}

  const todayStats=new Set((APP.xpLog||[]).filter(e=>e.date===today).map(e=>e.stat));
  todayStats.add(q.stat);
  const isRen=STAT_KEYS.every(k=>todayStats.has(k));

  c.stats[q.stat]=newStatXP;
  c.coins+=finalCoin;
  c.totalCoinsEarned=(c.totalCoinsEarned||0)+finalCoin;
  c.streak=newStreak;
  c.lastActive=today;
  c.lastStreakDate=today;
  if(isFinal){
    c.questsDone=(c.questsDone||0)+1;
    if(isBossDone)c.bossesCompleted=(c.bossesCompleted||0)+1;
    if(q.type==='weekly')c.weeklyQuestsDone=(c.weeklyQuestsDone||0)+1;
  }
  if(q.sub&&q.sub>1)c.subTicksTotal=(c.subTicksTotal||0)+1;
  if(isRen&&isFinal)c.renaissanceCount=(c.renaissanceCount||0)+1;

  // Counter untuk trofi berbasis waktu — pakai jam & hari WIB (konsisten dengan todayStr()/reset harian)
  const wibNow=new Date(Date.now()+7*3600000);
  const wibHour=wibNow.getUTCHours(),wibDow=wibNow.getUTCDay();
  if(wibHour<6)c.earlyBirdCount=(c.earlyBirdCount||0)+1;
  if(wibHour>=23)c.nightOwlCount=(c.nightOwlCount||0)+1;
  if(wibDow===0||wibDow===6)c.weekendQuestCount=(c.weekendQuestCount||0)+1;
  if(!Array.isArray(c.dowCompleted)||c.dowCompleted.length!==7)c.dowCompleted=[false,false,false,false,false,false,false];
  c.dowCompleted[wibDow]=true;

  // Hitung quest terbanyak dalam satu hari (untuk trofi "hari produktif")
  if(c.todayQuestDate!==today){c.todayQuestDate=today;c.todayQuestCount=0;}
  c.todayQuestCount=(c.todayQuestCount||0)+1;
  if(c.todayQuestCount>(c.maxQuestsInDay||0))c.maxQuestsInDay=c.todayQuestCount;

  // Hadiah milestone jumlah quest per hari — sengaja cuma koin (bukan XP), biar jadi "dopamin" instan
  // yang terpisah dari progres level, sesuai permintaan.
  if(c.dailyMilestoneDate!==today){c.dailyMilestoneDate=today;c.dailyMilestonesClaimed=[];}
  const dmClaimed=c.dailyMilestonesClaimed;
  [{key:5,coin:100},{key:10,coin:250}].forEach((m,mi)=>{
    if(c.todayQuestCount>=m.key&&!dmClaimed.includes(m.key)){
      c.coins+=m.coin;c.totalCoinsEarned=(c.totalCoinsEarned||0)+m.coin;
      dmClaimed.push(m.key);
      setTimeout(()=>pushToast('🎯','Milestone '+m.key+' Quest Hari Ini!','+'+m.coin+' 🪙 bonus',true),950+mi*350);
    }
  });
  const activeDailies=APP.quests.filter(qq=>qq.type==='daily'&&questActiveToday(qq));
  if(activeDailies.length&&activeDailies.every(qq=>qq.done)&&!dmClaimed.includes('all')){
    c.coins+=250;c.totalCoinsEarned=(c.totalCoinsEarned||0)+250;c.gems=(c.gems||0)+1;
    dmClaimed.push('all');
    setTimeout(()=>pushToast('🏆','Semua Quest Hari Ini Selesai!','+250 🪙 +1 💎 — luar biasa!',true),1700);
  }

  saveChar();saveQuests();

  appendXpLog({date:today,stat:q.stat,xp:bonusXP,coin:finalCoin,ts:ts});
  APP.xpLog=lsGet('xp_log',[]);

  const mLabel=mult.xp>1?' (×'+mult.xp.toFixed(1)+' Event!)':'';
  if(newOvLv>prevOvLv){
    pushToast('🎉',pick(PRAISE_LV),'Level '+prevOvLv+' → '+newOvLv,true);
    addJourneyItem('level_up','Naik ke Level '+newOvLv+'!','+'+bonusXP+' XP'+mLabel);
    const rwd=getLvReward(newOvLv);
    if(rwd){
      c.coins+=(rwd.coin||0);c.freezes+=(rwd.fz||0);c.gems=(c.gems||0)+(rwd.gem||0);saveChar();
      setTimeout(()=>pushToast('🎁','Hadiah Level '+newOvLv+'!',(rwd.coin?'+'+rwd.coin+' 🪙':'')+(rwd.fz?' +'+rwd.fz+' ❄️':'')+(rwd.gem?' +'+rwd.gem+' 💎':''),true),700);
    }
  } else if(newStatLv>prevStatLv){
    pushToast(STATS[q.stat].emoji,pick(PRAISE),STATS[q.stat].label+' naik ke Lv'+newStatLv+'!',true);
  } else if(isFinal&&isBossDone){
    c.gems=(c.gems||0)+5;saveChar();
    pushToast('👑','BOSS QUEST SELESAI!',q.title+' • +5 💎',true);
    addJourneyItem('boss_done','Boss Quest: '+q.title,'Pencapaian besar! +5 💎');
  } else if(isFinal){
    pushToast('✨',pick(PRAISE),'+'+bonusXP+' XP • 🪙+'+finalCoin+(loot?' (Loot!)':'')+mLabel);
  } else {
    pushToast(STATS[q.stat].emoji,'Progress dicatat!','+'+bonusXP+' XP • 🪙+'+finalCoin+' • ('+q.subDone+'/'+q.sub+')');
  }

  if(newAvStage.emoji!==prevAvStage){
    setTimeout(()=>pushToast(newAvStage.emoji,'Berevolusi menjadi '+newAvStage.name+'!','Petualanganmu memasuki babak baru',true),800);
    addJourneyItem('avatar_evolve','Berevolusi menjadi '+newAvStage.name+' '+newAvStage.emoji,'Level '+newOvLv+' tercapai');
  }

  if(isFinal&&[7,14,21,30,60,90,180,365].includes(newStreak)&&!(c.streakMilestonesSeen||[]).includes(newStreak)){
    c.gems=(c.gems||0)+2;
    c.streakMilestonesSeen=[...(c.streakMilestonesSeen||[]),newStreak];
    saveChar();
    addJourneyItem('streak_milestone','Streak '+newStreak+' hari beruntun! 🔥','Konsistensi luar biasa! +2 💎');
    setTimeout(()=>pushToast('🔥','Streak '+newStreak+' Hari!','+2 💎 hadiah konsistensi',true),750);
  }

  if(isFinal)setTimeout(()=>{
    const nb=checkBadges(APP.char,APP.badges,{rivals:APP.rivals});
    if(nb.length){
      APP.badges=[...APP.badges,...nb.map(b=>b.id)];saveBadges();
      nb.forEach((b,i)=>setTimeout(()=>{pushToast(b.emoji,'Trofi baru: '+b.name+'!',b.desc,true);addJourneyItem('badge','Trofi: '+b.name+' '+b.emoji,b.desc);},i*600));
    }
  },60);

  setTimeout(()=>{
    ACHIEV_DEFS.forEach(def=>{
      if(def.trigger&&def.trigger(APP.char))triggerAchievEv(def);
      if(def.isBoss&&isBossDone&&isFinal)triggerAchievEv(def);
      if(def.isRen&&isRen)triggerAchievEv(def);
    });
  },100);
}

// ===== CATATAN PROGRES PER QUEST (opsional) =====
// Untuk quest berjenjang (misal belajar bahasa/materi) yang progresnya suka kelewat kalau malas.
// Cukup 1 catatan per hari per quest (kalau isi ulang di hari sama, catatan lama di hari itu diperbarui,
// bukan numpuk jadi berkali-kali), dan dibatasi 100 entri terakhir biar tidak membengkak.
function addQuestProgressNote(questId,noteText){
  const q=APP.quests.find(x=>x.id===questId);
  if(!q||!noteText||!noteText.trim())return;
  if(!Array.isArray(q.progressNotes))q.progressNotes=[];
  const today=todayStr();
  const text=noteText.trim().slice(0,120);
  const last=q.progressNotes[q.progressNotes.length-1];
  if(last&&last.date===today){last.note=text;}
  else{q.progressNotes.push({date:today,note:text});}
  if(q.progressNotes.length>100)q.progressNotes.splice(0,q.progressNotes.length-100);
  saveQuests();
}
function completeQuest(questId){
  const q=APP.quests.find(x=>x.id===questId);
  if(!q||q.done)return;
  if(q.sub&&q.sub>1){tickSubQuest(questId);return;}
  const charSnap=snapshotChar(APP.char);
  const ts=Date.now();
  const isBossDone=q.type==='boss'&&q.boss&&(q.boss.cur+1)>=q.boss.target;
  let prevBossCur;
  if(q.type==='boss'&&q.boss){
    prevBossCur=q.boss.cur;
    q.boss.cur=Math.min(q.boss.cur+1,q.boss.target);
  } else {
    q.done=true;
  }
  APP.lastAction={questId,ts,charSnap,kind:q.type==='boss'?'boss':'normal',prevBossCur};
  applyQuestReward(q,q.xp,q.coin,true,isBossDone,ts);
}

// tickSubQuest: untuk quest bertahap (misal "Sholat 5 waktu"). Tiap centang kecil dapat
// bagian XP/koin proporsional (sisa pembagian dimasukkan ke centang terakhir biar totalnya pas),
// dan quest baru dianggap SELESAI PENUH (q.done=true, trofi/streak-milestone dicek) di centang terakhir.
function tickSubQuest(questId){
  const q=APP.quests.find(x=>x.id===questId);
  if(!q||q.done||!q.sub||q.sub<2||(q.subDone||0)>=q.sub)return;
  const charSnap=snapshotChar(APP.char);
  const ts=Date.now();
  const prevSubDone=q.subDone||0;
  q.subDone=prevSubDone+1;
  const isFinal=q.subDone>=q.sub;
  const perXp=Math.floor(q.xp/q.sub),perCoin=Math.floor(q.coin/q.sub);
  const tickXp=isFinal?q.xp-perXp*(q.sub-1):perXp;
  const tickCoin=isFinal?q.coin-perCoin*(q.sub-1):perCoin;
  if(isFinal)q.done=true;
  APP.lastAction={questId,ts,charSnap,kind:'sub',prevSubDone};
  applyQuestReward(q,tickXp,tickCoin,isFinal,false,ts);
}

// ===== DAILY RESET =====
function checkDailyReset(){
  const c=APP.char;
  const today=todayStr();
  const lastActive=c.lastActive||c.lastActiveDate||null;
  // Weekly reset: cek setiap kali app dibuka, terlepas dari status daily reset di bawah.
  // Kunci minggu berubah tepat pada batas Minggu 24.00 WIB / Senin 00.00 WIB.
  const wk=weekKeyWIB(today);
  if(c.lastWeekKey&&c.lastWeekKey!==wk){
    APP.quests.forEach(q=>{if(q.type==='weekly'){q.done=false;if(q.sub&&q.sub>1)q.subDone=0;}});
    saveQuests();
  }
  c.lastWeekKey=wk;
  if(lastActive&&lastActive!==today){
    // Reset daily quests (mutate in-place agar referensi eksternal ikut terupdate)
    APP.quests.forEach(q=>{if(q.type==='daily'){q.done=false;q.completedToday=false;if(q.sub&&q.sub>1)q.subDone=0;}});
    // Streak-break/freeze pakai lastStreakDate (hari terakhir beneran nyelesain quest),
    // bukan lastActive (hari terakhir buka app) — supaya cuma buka app tanpa ngerjain apa-apa
    // tidak keliru dianggap "aktif" dan tidak salah menghitung jeda absen.
    const lastStreak=c.lastStreakDate||lastActive;
    const diff=Math.round((new Date(today)-new Date(lastStreak))/86400000);
    if(diff>1){
      if((c.freezes||0)>0)c.freezes=((c.freezes||0)-1);
      else c.streak=0;
      const cb=ACHIEV_DEFS.find(d=>d.isComeback);
      if(cb)triggerAchievEv(cb);
    }
    c.lastActive=today;
    saveChar();saveQuests();
  } else if(!lastActive){
    c.lastActive=today;saveChar();
  }
  cleanAchievEvs();
}

<script>
// ===== STEP 4: DOM HELPERS =====
function el(tag,cls,html,attrs){
  const d=document.createElement(tag);
  if(cls)d.className=cls;
  if(html!=null)d.innerHTML=html;
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==='onclick')d.onclick=v;else if(k==='oninput')d.oninput=v;else if(k==='onchange')d.onchange=v;else d.setAttribute(k,v);});
  return d;
}
function div(cls,html){return el('div',cls,html);}
function span(cls,html){return el('span',cls,html);}
function btn(cls,html,onclick){const b=el('button',cls,html);b.onclick=onclick;return b;}
function inp(cls,attrs){return el('input',cls,null,attrs);}
function sel(cls,opts,val){
  const s=el('select',cls);
  opts.forEach(o=>{const op=el('option','',o.label,{value:o.value});if(o.value===val)op.selected=true;s.appendChild(op);});
  return s;
}
function frag(...children){const f=document.createDocumentFragment();children.forEach(c=>{if(c)f.appendChild(typeof c==='string'?document.createTextNode(c):c);});return f;}
function ap(parent,...children){children.forEach(c=>{if(c!=null)parent.appendChild(typeof c==='string'?document.createTextNode(c):c);});return parent;}

// ===== STEP 5: RENDER FUNCTIONS =====

// --- QUEST TAB ---
function renderQuestTab(){
  const f=document.createDocumentFragment();
  // skill tree (boss quests)
  const bossQuests=APP.quests.filter(q=>q.type==='boss'&&q.boss);
  if(bossQuests.length){
    const p=div('panel');
    ap(p,div('section-title','🗺️ Skill Tree — Cita-cita Besar'));

      const nodes=div('boss-nodes');

        const filled=i<q.boss.cur,isCur=i===q.boss.cur;

      }
      const pt=div('boss-progress-text',q.boss.cur>=q.boss.target?'Tercapai! 🎉':'Progres '+q.boss.cur+'/'+q.boss.target+' milestone');
      ap(bc,th,nodes,pt);
      const complBtn=btn('add-btn','✓ Tandai Progres Boss',function(){completeQuest(q.id);});
      if(q.boss.cur>=q.boss.target)complBtn.disabled=true;
      const rowActions=div('boss-row-actions');
      ap(rowActions,complBtn);
      if(APP.lastAction&&APP.lastAction.questId===q.id){
        ap(rowActions,btn('btn-undo','↺ Batalkan',()=>undoLastAction()));
      }
      ap(rowActions,btn('quest-del','×',()=>{APP.deleteBossId=q.id;APP.showModal='deleteBoss';render();}));
      ap(p,bc,rowActions);
    });
    f.appendChild(p);
  }
  // daily & weekly
  const p=div('panel');
  const renderQuestCard=(q)=>{
    const s=STATS[q.stat]||STATS.discipline;
    const hasSub=q.sub&&q.sub>1;
    const prio=q.priority?priorityInfo(q.priority):null;
    const qc=div('quest-card'+(q.done?' done':''));
    if(prio){qc.style.border='2px solid '+prio.color;qc.style.boxShadow='0 0 0 1px '+prio.color+'33 inset';}
    let chk;
    if(hasSub){
      const subDone=q.subDone||0;
      chk=div('quest-check sub-progress-badge',subDone+'/'+q.sub);
      chk.style.cursor='default';chk.style.fontSize='11px';chk.style.fontWeight='700';
      if(q.done)chk.classList.add('checked');
    } else {
      chk=div('quest-check'+(q.done?' checked':''),q.done?'✓':'');chk.style.cursor='pointer';chk.style.minWidth='28px';
      if(!q.done){
        chk.onclick=function(e){e.stopPropagation();completeQuest(q.id);};
        chk.style.cursor='pointer';
      }
    }
    const body=div('quest-body');
    const titleRow=div('');titleRow.style.display='flex';titleRow.style.alignItems='center';titleRow.style.gap='6px';titleRow.style.flexWrap='wrap';
    ap(titleRow,div('quest-title'+(q.done?' done':''),q.title));
    if(prio){const pb=span('priority-badge','P'+prio.v);pb.style.background=prio.color+'26';pb.style.color=prio.color;pb.style.borderColor=prio.color+'55';ap(titleRow,pb);}
    ap(body,titleRow);
    if(hasSub){
      const subRow=div('sub-check-wrap-full');
      const subDone=q.subDone||0;
      for(let i=0;i<q.sub;i++){
        const dot=div('sub-dot'+(i<subDone?' filled':''),i<subDone?'✓':'');

        subRow.appendChild(dot);
      }
      ap(body,subRow);

    const meta=div('quest-meta');
    ap(meta,span('quest-tag',s.emoji+' '+s.label),span('quest-reward','+'+q.xp+' XP • 🪙+'+q.coin));

    ap(body,meta);

      const lastNote=Array.isArray(q.progressNotes)&&q.progressNotes.length?q.progressNotes[q.progressNotes.length-1]:null;

  if(APP.quests.filter(q=>q.type!=='boss').length===0){ap(p,div('empty','Belum ada quest. Tambahkan satu untuk mulai! 🌱'));}
  const addB=btn('add-btn','+ Tambah Quest Baru',()=>{APP.editQuestId=null;APP.showModal='addQuest';render();});
  ap(p,addB);f.appendChild(p);
  return f;
}

function aggregateByDate(days){
  const today=new Date(),dates=[];
  for(let i=days-1;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);dates.push(d.toISOString().slice(0,10));}
  const m={};dates.forEach(d=>{m[d]={date:d,total:0};STAT_KEYS.forEach(k=>m[d][k]=0);});
  APP.xpLog.forEach(e=>{const sk=e.stat||e.statType;if(m[e.date]&&sk){m[e.date][sk]=(m[e.date][sk]||0)+e.xp;m[e.date].total+=e.xp;}});
  return dates.map(d=>m[d]);
}

function renderChart(data,vis){
  const W=560,H=200,pl=46,pr=12,pt=16,pb=28,iW=W-pl-pr,iH=H-pt-pb;
  const maxV=Math.max(50,...data.map(d=>Math.max(...STAT_KEYS.map(k=>vis.includes(k)?d[k]:0))));
  const yMax=Math.ceil(maxV/50)*50;
  const sx=data.length>1?iW/(data.length-1):iW;
  const toY=v=>pt+iH-(v/yMax)*iH;
  const toX=i=>pl+i*sx;
  const every=Math.ceil(data.length/6);
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('width','100%');svg.style.minWidth='340px';
  // grid
  [0,0.25,0.5,0.75,1].forEach((p,i)=>{
    const yv=Math.round(yMax*p),yp=toY(yMax*p);
    const ln=document.createElementNS(ns,'line');
    ln.setAttribute('x1',pl);ln.setAttribute('x2',W-pr);ln.setAttribute('y1',yp);ln.setAttribute('y2',yp);
    ln.setAttribute('stroke','#1E4068');ln.setAttribute('stroke-width','1');ln.setAttribute('opacity','0.7');
    if(p>0)ln.setAttribute('stroke-dasharray','3,3');
    svg.appendChild(ln);
    const txt=document.createElementNS(ns,'text');
    txt.setAttribute('x',pl-6);txt.setAttribute('y',yp+3);txt.setAttribute('font-size','9');txt.setAttribute('fill','#6A9BBF');txt.setAttribute('text-anchor','end');
    txt.textContent=yv;svg.appendChild(txt);
  });
  // Y label
  const yLbl=document.createElementNS(ns,'text');
  yLbl.setAttribute('x','10');yLbl.setAttribute('y',pt+iH/2);yLbl.setAttribute('font-size','9');yLbl.setAttribute('fill','#6A9BBF');yLbl.setAttribute('text-anchor','middle');
  yLbl.setAttribute('transform','rotate(-90,10,'+(pt+iH/2)+')');yLbl.textContent='XP';svg.appendChild(yLbl);
  // lines per stat
  STAT_KEYS.filter(k=>vis.includes(k)).forEach(k=>{
    const s=STATS[k];
    const pts=data.map((d,i)=>toX(i).toFixed(1)+','+toY(d[k]).toFixed(1)).join(' ');
    const area=document.createElementNS(ns,'path');
    const areaPts=data.map((d,i)=>(i===0?'M':'L')+toX(i).toFixed(1)+' '+toY(d[k]).toFixed(1)).join(' ')+' L'+toX(data.length-1).toFixed(1)+' '+toY(0).toFixed(1)+' L'+toX(0).toFixed(1)+' '+toY(0).toFixed(1)+'Z';
    area.setAttribute('d',areaPts);area.setAttribute('fill',s.color);area.setAttribute('opacity','0.06');svg.appendChild(area);
    const linePts=data.map((d,i)=>(i===0?'M':'L')+toX(i).toFixed(1)+' '+toY(d[k]).toFixed(1)).join(' ');
    const line=document.createElementNS(ns,'path');
    line.setAttribute('d',linePts);line.setAttribute('fill','none');line.setAttribute('stroke',s.color);line.setAttribute('stroke-width','2');line.setAttribute('stroke-linejoin','round');line.setAttribute('stroke-linecap','round');
    svg.appendChild(line);
    // dots
    data.forEach((d,i)=>{if(d[k]>0){const c=document.createElementNS(ns,'circle');c.setAttribute('cx',toX(i));c.setAttribute('cy',toY(d[k]));c.setAttribute('r','2.5');c.setAttribute('fill',s.color);c.setAttribute('opacity','0.8');svg.appendChild(c);}});
  });
  // X labels
  data.forEach((d,i)=>{if(i%every===0){const t=document.createElementNS(ns,'text');t.setAttribute('x',toX(i));t.setAttribute('y',H-8);t.setAttribute('font-size','9');t.setAttribute('fill','#6A9BBF');t.setAttribute('text-anchor','middle');t.textContent=d.date.slice(5);svg.appendChild(t);}});
  // axes
  ['x1,x2,y1,y2,stroke,stroke-width'.split(',')].forEach(()=>{});
  [[pl,pl,pt,H-pb],[pl,W-pr,H-pb,H-pb]].forEach(([x1,x2,y1,y2])=>{const ln=document.createElementNS(ns,'line');ln.setAttribute('x1',x1);ln.setAttribute('x2',x2);ln.setAttribute('y1',y1);ln.setAttribute('y2',y2);ln.setAttribute('stroke','#1E4068');ln.setAttribute('stroke-width','1');svg.appendChild(ln);});
  return svg;
}

function renderHeatmap(){
  const today=new Date(),cells=[];
  for(let i=83;i>=0;i--){const d=new Date(today);d.setDate(d.getDate()-i);const ds=d.toISOString().slice(0,10);const xp=APP.xpLog.filter(e=>e.date===ds).reduce((s,e)=>s+e.xp,0);cells.push({ds,xp});}
  const cols=[];for(let i=0;i<cells.length;i+=7)cols.push(cells.slice(i,i+7));
  const tint=xp=>xp<=0?'rgba(14,165,233,0.06)':xp<50?'rgba(14,165,233,0.3)':xp<150?'rgba(14,165,233,0.55)':'rgba(14,165,233,0.9)';
  const wrap=div('heatmap-wrap');
  const grid=div('heatmap-grid');
  cols.forEach(col=>{const c=div('heatmap-col');col.forEach(cell=>{const ce=div('heatmap-cell');ce.style.background=tint(cell.xp);ce.title=cell.ds+': '+cell.xp+' XP';c.appendChild(ce);});grid.appendChild(c);});
  const legend=div('heatmap-legend','<span>Sedikit</span>');
  [0.06,0.3,0.55,0.9].forEach(o=>{const c=div('heatmap-cell');c.style.background='rgba(14,165,233,'+o+')';legend.appendChild(c);});
  ap(legend,span('','Banyak'));
  ap(wrap,grid,legend);return wrap;
}

function sumXP(daysAgo,offsetDays){
  const now=new Date(),s=new Date(now),e=new Date(now);
  s.setDate(s.getDate()-daysAgo-offsetDays);e.setDate(e.getDate()-offsetDays);
  return (APP.xpLog||[]).filter(en=>{const d=new Date(en.date);return d>=s&&d<e;}).reduce((a,en)=>a+en.xp,0);
}
function autoSummary(){
  const tw=sumXP(7,0),lw=sumXP(7,7);
  const stw={};STAT_KEYS.forEach(k=>stw[k]=0);
  const now=new Date(),ws=new Date(now);ws.setDate(ws.getDate()-7);
  APP.xpLog.forEach(e=>{const d=new Date(e.date);const sk=e.stat||e.statType;if(d>=ws&&d<=now&&sk)stw[sk]=(stw[sk]||0)+e.xp;});
  const sorted=STAT_KEYS.slice().sort((a,b)=>stw[b]-stw[a]),top=sorted[0],bot=sorted[sorted.length-1];
  let s='';
  if(!APP.xpLog.length)s='Belum ada aktivitas. Yuk mulai dari satu quest kecil!';
  else if(tw>lw)s='Kamu naik dari '+lw+' XP minggu lalu menjadi '+tw+' XP minggu ini — progres nyata!';
  else if(tw<lw)s='Minggu ini '+tw+' XP, sedikit lebih rendah dari '+lw+' XP minggu lalu. Tidak masalah — tetap lanjut!';
  else s='Konsisten di angka yang sama ('+tw+' XP). Stabil itu juga progres.';
  if(stw[top]>0)s+=' '+STATS[top].label+' '+STATS[top].emoji+' paling berkembang minggu ini.';
  return s;
}

const REWARD_CATS=['Istirahat','Hiburan','Kuliner','Belanja','Self-care','Lainnya'];
function rewardRarity(cost){return cost>=300?{label:'Epic',cls:'epic'}:cost>=100?{label:'Rare',cls:'rare'}:{label:'Common',cls:'common'};}
const MYSTERY_BOX_COST=50;
const MYSTERY_POOL=[
  {label:'+20 Koin',weight:30,apply:c=>{c.coins+=20;c.totalCoinsEarned=(c.totalCoinsEarned||0)+20;}},
  {label:'+60 Koin — Jackpot! 🎉',weight:8,apply:c=>{c.coins+=60;c.totalCoinsEarned=(c.totalCoinsEarned||0)+60;}},
  {label:'+1 ❄️ Freeze',weight:20,apply:c=>{c.freezes=(c.freezes||0)+1;}},
  {label:'+1 💎 Permata!',weight:12,apply:c=>{c.gems=(c.gems||0)+1;}},
  {label:'Cuma +5 Koin — apes 😅',weight:30,apply:c=>{c.coins+=5;c.totalCoinsEarned=(c.totalCoinsEarned||0)+5;}},
];
function openMysteryBox(){
  const c=APP.char;
  if(c.coins<MYSTERY_BOX_COST)return;
  c.coins-=MYSTERY_BOX_COST;
  const totalW=MYSTERY_POOL.reduce((a,m)=>a+m.weight,0);
  let roll=Math.random()*totalW,pick=MYSTERY_POOL[MYSTERY_POOL.length-1];
  for(const m of MYSTERY_POOL){if(roll<m.weight){pick=m;break;}roll-=m.weight;}
  pick.apply(c);
  saveChar();
  pushToast('🎰','Mystery Box dibuka!',pick.label,true);
  render();
}

// ===== DIAGNOSTIK / TROUBLESHOOTING =====
// Mengecek kondisi data untuk deteksi masalah dini, tanpa perlu buka DevTools (susah di HP).
function runDiagnostics(){
  const issues=[];
  const c=APP.char;
  if(!c){issues.push({level:'error',msg:'Data karakter tidak ditemukan sama sekali.'});return issues;}
  STAT_KEYS.forEach(k=>{
    const v=c.stats?c.stats[k]:undefined;
    if(typeof v!=='number'||!isFinite(v))issues.push({level:'error',msg:'Stat '+k+' rusak (nilai: '+v+').'});
    else if(v<0)issues.push({level:'warning',msg:'Stat '+k+' bernilai negatif ('+v+').'});
  });
  if(typeof c.coins!=='number'||!isFinite(c.coins))issues.push({level:'error',msg:'Koin rusak (nilai: '+c.coins+').'});
  else if(c.coins<0)issues.push({level:'warning',msg:'Koin bernilai negatif.'});
  if(typeof c.gems!=='number'||!isFinite(c.gems)||c.gems<0)issues.push({level:'warning',msg:'Permata bernilai tidak wajar: '+c.gems});
  if(typeof c.streak!=='number'||!isFinite(c.streak)||c.streak<0)issues.push({level:'warning',msg:'Streak bernilai tidak wajar: '+c.streak});
  APP.quests.forEach((q,i)=>{
    if(!q||typeof q!=='object'){issues.push({level:'error',msg:'Quest ke-'+i+' formatnya rusak total.'});return;}
    if(!q.id)issues.push({level:'warning',msg:'Quest "'+(q.title||'(tanpa judul)')+'" tidak punya ID unik.'});
    if(!STATS[q.stat])issues.push({level:'warning',msg:'Quest "'+(q.title||'?')+'" merujuk stat tidak dikenal: '+q.stat});
    if(typeof q.xp!=='number'||!isFinite(q.xp))issues.push({level:'warning',msg:'Quest "'+(q.title||'?')+'" nilai XP rusak.'});
  });
  (APP.finance||[]).forEach(h=>{
    if(!isFinite(h.value)||h.value<0)issues.push({level:'error',msg:'Investasi jenis '+h.type+' nilainya rusak ('+h.value+').'});
  });
  (APP.collectibles||[]).forEach(h=>{
    if(!COLLECTIBLE_DEFS.some(d=>d.id===h.type))issues.push({level:'warning',msg:'Koleksi jenis tidak dikenal: '+h.type});
  });
  (APP.rivals||[]).forEach(r=>{
    if(!isFinite(r.totalXP))issues.push({level:'error',msg:'Rival '+(r.name||r.id)+' totalXP rusak.'});
  });
  if(APP.badges.length!==new Set(APP.badges).size)issues.push({level:'warning',msg:'Ada trofi tersimpan dobel (duplikat).'});
  return issues;
}
// Perbaiki yang aman untuk diperbaiki otomatis (tidak menghapus progres nyata, cuma
// membetulkan nilai yang jelas-jelas rusak/tidak wajar).
function autoFixIssues(){
  const c=APP.char;
  if(c){
    STAT_KEYS.forEach(k=>{
      const v=c.stats?c.stats[k]:undefined;
      if(typeof v!=='number'||!isFinite(v)||v<0)c.stats[k]=Math.max(0,Number(v)||0);
    });
    if(typeof c.coins!=='number'||!isFinite(c.coins)||c.coins<0)c.coins=Math.max(0,Number(c.coins)||0);
    if(typeof c.gems!=='number'||!isFinite(c.gems)||c.gems<0)c.gems=Math.max(0,Number(c.gems)||0);
    if(typeof c.streak!=='number'||!isFinite(c.streak)||c.streak<0)c.streak=0;
    saveChar();
  }
  APP.quests=APP.quests.filter(q=>q&&typeof q==='object'&&q.id);
  APP.quests.forEach(q=>{
    if(typeof q.xp!=='number'||!isFinite(q.xp))q.xp=10;
    if(typeof q.coin!=='number'||!isFinite(q.coin))q.coin=5;
    if(!STATS[q.stat])q.stat='discipline';
  });
  saveQuests();
  APP.finance=(APP.finance||[]).filter(h=>isFinite(h.value)&&h.value>=0);
  lsSetSync('finance',APP.finance);
  APP.badges=[...new Set(APP.badges)];
  saveBadges();
  render();
}

<script>
// ===== STEP 6: MAIN RENDER + INIT =====

// ===== INIT =====
async function init(){
  // show loading
  document.getElementById('root').innerHTML='<div class="loading-screen"><div class="spinner"></div><p>Menyiapkan duniamu...</p></div>';

  // load local data
  const noLocal=lsLoad();

  // if no local data and online, try pull from Sheets
  if(noLocal&&navigator.onLine){
    try{
      const r=await loadFromSheets();
      if(r.ok&&r.data&&r.data.character){
        lsLoad(); // reload after sheets data written
        APP.syncStatus='synced';
      }
    }catch(e){ APP.syncStatus='offline'; }
  }

  // sync pending if online
  if(navigator.onLine&&getPending().length>0){
    APP.syncStatus='syncing';
    syncToSheets().then(r=>{ APP.syncStatus=r.success?'synced':'offline'; });
  }

  // daily reset check
  checkDailyReset();
  claimRandomEventOnceRewards();
  updateFinanceDaily();
  // Cek berkala HANYA untuk kesan "hidup" saat tab Keuangan sedang dibuka & app aktif —
  // BUKAN sumber kebenaran data. Kalau tab di-background/HP terkunci, browser akan menjeda ini
  // sendiri (hemat baterai), dan begitu dibuka lagi, updateFinanceDaily() di atas tetap menghitung
  // benar berdasarkan selisih waktu asli — jadi TIDAK butuh timer ini jalan terus untuk akurat.
  if(!APP.tradingInt){
    APP.tradingInt=setInterval(()=>{
      const before=JSON.stringify(APP.finance);
      updateFinanceDaily();
      if(APP.tab==='finance'&&JSON.stringify(APP.finance)!==before)render();
    },30000);
  }

  // auto sync every 30s
  if(APP.autoSyncInt)clearInterval(APP.autoSyncInt);
  APP.autoSyncInt=setInterval(async()=>{
    if(navigator.onLine&&getPending().length>0){
      APP.syncStatus='syncing';
      const r=await syncToSheets();
      APP.syncStatus=r.success?'synced':'offline';
    }
  },30000);

  render();
}

function render(){
  const root=document.getElementById('root');
  // clear root and build container
  root.innerHTML='';
  const container=div('container');
  const header=div('header');
  const h1=el('h1','display','⚔️ Life RPG');ap(header,h1,div('','Perjalanan menuju versi terbaik dirimu'));
  container.appendChild(header);

  // char card
  container.appendChild(renderCharCard());

  // event banners
  const allActive=[...getActiveScheduled(),...getActiveAchievEvs()];
  if(allActive.length){const bf=renderEventBanners(allActive);if(bf)container.appendChild(bf);}

  // tab nav
  container.appendChild(renderTabNav());

  // tab content
  switch(APP.tab){
    case 'quests':  container.appendChild(renderQuestTab());break;
    case 'events':  container.appendChild(renderEventTab());break;
    case 'rivals':  container.appendChild(renderRivalsTab());break;
    case 'stats':   container.appendChild(renderStatsTab());break;
    case 'journey': container.appendChild(renderJourneyTab());break;
    case 'journal': container.appendChild(renderJournalTab());break;
    case 'badges':  container.appendChild(renderBadgesTab());break;
    case 'shop':    container.appendChild(renderShopTab());break;
    case 'finance': container.appendChild(renderFinanceTab());break;
    case 'backup':  container.appendChild(renderBackupTab());break;
  }

  root.appendChild(container);

  // modals (outside container, fullscreen)
  if(APP.showModal==='addQuest')      root.appendChild(renderAddQuestModal());
  if(APP.showModal==='addReward')     root.appendChild(renderAddRewardModal());
  if(APP.showModal==='deleteConfirm') root.appendChild(renderDeleteModal());
  if(APP.showModal==='deleteBoss')    root.appendChild(renderDeleteBossModal());
  if(APP.showModal==='invest')        root.appendChild(renderInvestModal());
  if(APP.showModal==='addJourney')    root.appendChild(renderAddJourneyModal());
  if(APP.showModal==='financeInfo')   root.appendChild(renderFinanceInfoModal());
  if(APP.showModal==='buyCollectible') root.appendChild(renderBuyCollectibleModal());
  if(APP.showModal==='sellInvest')    root.appendChild(renderSellInvestModal());
  if(APP.showModal==='sellCollectible') root.appendChild(renderSellCollectibleModal());
  if(APP.showModal==='progressNote')  root.appendChild(renderProgressNoteModal());

  // toasts
  renderToasts();
};

// start
init();
</script>
</body>
</html>
